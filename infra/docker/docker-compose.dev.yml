# Chromium Agentic Search Service - Development Docker Compose
# Use: docker-compose -f docker-compose.dev.yml up

version: '3.8'

services:
  # PostgreSQL Database (development)
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=chromium_search
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chromium-search-dev

  # Redis Cache (development)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chromium-search-dev

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  chromium-search-dev:
    driver: bridge
